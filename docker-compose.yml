services:
  postgres:
    image: postgres:16-alpine
    container_name: rivet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivet
      POSTGRES_PASSWORD: rivet
      POSTGRES_DB: rivet
    ports:
      - "5432:5432"
    volumes:
      - rivet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivet -d rivet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rivet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rivet_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rivet-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rivet
      MINIO_ROOT_PASSWORD: rivetminio
      # Bucket PutBucketCors is NotImplemented on this MinIO; server-level CORS instead.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:8090"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rivet_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Creates the export bucket. Fallback:
  # aws --endpoint-url http://localhost:9000 s3 mb s3://rivet-exports
  minio-init:
    image: minio/mc:latest
    container_name: rivet-minio-init
    depends_on:
      - minio
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        i=0
        until mc alias set rivet http://minio:9000 rivet rivetminio && mc mb --ignore-existing rivet/rivet-exports; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then
            echo "minio did not become ready"
            exit 1
          fi
          sleep 1
        done
        echo "minio bucket rivet-exports ready"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: rivet-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    extra_hosts:
      # API runs on the host; scrape http://host.docker.internal:8090/metrics
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - rivet_prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.7.2
    container_name: rivet-tempo
    restart: unless-stopped
    user: "0"
    command:
      - -config.file=/etc/tempo.yaml
    ports:
      - "4318:4318"
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - rivet_tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:11.5.2
    container_name: rivet-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rivet-api.json
    ports:
      # 3000 left free; local login admin / admin
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rivet_postgres_data:
  rivet_redis_data:
  rivet_minio_data:
  rivet_prometheus_data:
  rivet_tempo_data:
